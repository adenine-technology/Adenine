name: Build Android Native App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Initialize Capacitor Bridge
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Adenine technology.adenine.app --web-dir docs
          npx cap add android
          npx cap copy android

      - name: Compile Release-Ready Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --parallel --build-cache

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adenine-Native-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
