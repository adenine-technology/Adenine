name: Build Android Native App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21 Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Initialize Capacitor Bridge
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Adenine technology.adenine.app --web-dir docs
          npx cap add android
          npx cap copy android

      - name: Fix Kotlin Stdlib Version Clashes
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          if (details.requested.name.startsWith('kotlin-stdlib-jdk')) {
                              details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                          }
                      }
                  }
              }
          }
          EOF

      - name: Compile Standalone Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adenine-Native-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
